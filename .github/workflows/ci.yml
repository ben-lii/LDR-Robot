name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build -w web
        env:
          SESSION_SECRET: ci-session-secret-at-least-32-chars-long
          AUTH_USERS_JSON: '[{"email":"ci@example.com","passwordHash":"scrypt$16384$8$1$AAAAAAAAAAAAAAAAAAAAAA==$AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==","permission":"driver","robots":["robot-1"]}]'
          ROBOTS_JSON: '[{"id":"00000000-0000-4000-8000-000000000001","slug":"robot-1","name":"Robot 1","tunnelHost":"robot-1.example.com"}]'
          TOKEN_SIGNING_PRIVATE_JWK: '{"kty":"EC","crv":"P-256","x":"bExkQThVBa6RAkObK2NjBzTxgKclXKoS70yrlJN1GmU","y":"MrVtLUld9egIMRqze3qhLC5BAn_t3Ae9FIMwLc2FmH4","d":"aE_FWjw1sZJRd7yl2MPOEv1IcFJ_PUVD2baLVN9IIVo","alg":"ES256","use":"sig"}'
